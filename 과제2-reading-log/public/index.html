<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>독서 기록</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 16px;
           font-family: system-ui, sans-serif; color: #222; }
    h1 { color: #714797; margin-bottom: 4px; }
    #stats { color: #555; margin-bottom: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #f3eef8; }
    #count { color: #555; margin-top: 12px; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <!-- 제공 파일 — 수정하지 않음. 서버의 조회 API를 확인하기 위한 화면 -->
  <h1>독서 기록</h1>
  <div id="stats"></div>

  <form id="filter">
    <select name="status">
      <option value="">전체 상태</option>
      <option value="want">읽고 싶음</option>
      <option value="reading">읽는 중</option>
      <option value="done">완독</option>
    </select>
    <input name="keyword" placeholder="제목 · 저자 검색" />
    <button>조회</button>
  </form>
  <p id="error"></p>

  <table>
    <thead>
      <tr><th>id</th><th>제목</th><th>저자</th><th>상태</th><th>별점</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="count"></p>

  <script>
    const LABEL = { want: '읽고 싶음', reading: '읽는 중', done: '완독' };
    const form = document.getElementById('filter');

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    async function loadStats() {
      const res = await fetch('/books/stats');
      if (!res.ok) return;
      const s = await res.json();
      document.getElementById('stats').textContent =
        `전체 ${s.total}권 · 읽고 싶음 ${s.want} · 읽는 중 ${s.reading} · ` +
        `완독 ${s.done}`;
    }

    async function loadBooks() {
      const params = new URLSearchParams();
      for (const [key, value] of new FormData(form)) {
        if (value !== '') params.set(key, value);
      }

      const res = await fetch('/books?' + params.toString());
      const data = await res.json();
      const errorBox = document.getElementById('error');
      const rows = document.getElementById('rows');
      rows.replaceChildren();
      if (!res.ok) {
        errorBox.textContent = `${res.status} ${data.message ?? ''}`;
        return;
      }
      errorBox.textContent = '';
      for (const b of data) {
        const tr = document.createElement('tr');
        tr.append(cell(b.id), cell(b.title), cell(b.author),
          cell(LABEL[b.status] ?? b.status), cell(b.rating ?? '-'));
        rows.append(tr);
      }
      document.getElementById('count').textContent = `총 ${data.length}권`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      loadBooks();
    });

    loadStats();
    loadBooks();
  </script>
</body>
</html>
